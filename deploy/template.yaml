apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: fabric-access-ai-dev
parameters:
- name: NAMESPACE
  value: ${NAMESPACE}
- name: BOT_IMAGE
  value: https://quay.io/repository/redhat-services-prod/hcc-accessmanagement-tenant/fabric-access-ai-dev
- name: IMAGE_TAG
  required: true
- name: BOT_LABEL
  value: hcc-ai-platform-accessmanagement
- name: BOT_REPLICAS
  value: "0"
- name: BOT_BOARD_NAME
  value: ""
- name: BOT_SPRINT_PREFIX
  value: ""
- name: BOT_INCLUDE_BACKLOG
  value: "false"
- name: BOT_INSTANCE_ID
  value: ""
- name: BOT_CONFIG_REPO
  value: ""
- name: BOT_NAME
  value: devbot-fabric-access
- name: BOT_CONFIG_PATH
  value: ""
- name: BOT_EXECUTION_ENGINE
  value: python
- name: REHOR_OPENCODE_DEPLOYMENT_CONFIG
  value: ""
- name: REHOR_OPENCODE_MAX_TOOL_CALLS
  value: ""
- name: REHOR_WORKSPACE_OWNER_UID
  description: Numeric UID owning /home/botuser/app in the image; the coordinator compares the workspace owner against it instead of the pod's runtime UID.
  value: "1000"
- name: REHOR_MODEL_PROXY_URL
  value: ""
- name: REHOR_MODEL_PROXY_TOKEN
  value: ""
- name: GCP_PROJECT_ID
  required: true
- name: GCP_REGION
  required: true
- name: VERTEX_ALLOWED_MODELS
  required: true
- name: KEDA_CRON_EU_TZ
  value: "Europe/Prague"
- name: KEDA_CRON_EU_START
  value: "0 9 * * 1-5"
- name: KEDA_CRON_EU_END
  value: "0 23 * * 1-5"
- name: KEDA_CRON_US_TZ
  value: "America/New_York"
- name: KEDA_CRON_US_START
  value: "0 9 * * 1-5"
- name: KEDA_CRON_US_END
  value: "0 18 * * 1-5"
objects:

# ============================================================================
# Bot-only deployment for fabric-access-ai-dev runner instance.
#
# Shared infrastructure (proxy, memory-server, secrets) is deployed by
# the platform-frontend-ai-dev template in the same namespace.
# This template creates only:
#   1. Bot Deployment (name controlled by BOT_NAME parameter)
#   2. NetworkPolicy (egress restricted to proxy + memory-server + DNS)
#
# Prerequisites (deployed by platform-frontend-ai-dev):
#   - devbot-proxy       (ports 3128, 9090, 8443, 8444, 8446, 8447, 8450)
#   - devbot-memory-server (port 8080)
#   - devbot-secrets     (Vault secret with git identity + credentials)
# ============================================================================

# --- Bot Deployment ---
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    replicas: ${{BOT_REPLICAS}}
    selector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ${BOT_NAME}
          app.kubernetes.io/component: bot
          app.kubernetes.io/part-of: devbot
      spec:
        containers:
        - name: bot
          image: ${BOT_IMAGE}:${IMAGE_TAG}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          - name: BOT_LABEL
            value: ${BOT_LABEL}
          - name: BOT_MEMORY_URL
            value: http://devbot-memory-server:8080/mcp
          - name: BOT_MEMORY_HEALTH_URL
            value: http://devbot-memory-server:8080/health
          - name: BOT_MEMORY_HEALTH_TIMEOUT
            value: "120"
          # Vertex AI — auth proxied through proxy container
          - name: CLAUDE_CODE_SKIP_VERTEX_AUTH
            value: "true"
          - name: ANTHROPIC_VERTEX_BASE_URL
            value: http://devbot-proxy:8443
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: dummy-project
          - name: CLOUD_ML_REGION
            value: global
          # Executor — thin client connects to proxy over TCP
          - name: EXECUTOR_ADDR
            value: devbot-proxy:9090
          # Git identity — per-platform (from shared Vault secret)
          - name: GH_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gh-username
          - name: GH_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-email
          - name: GL_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-name
          - name: GL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-email
          # Jira identity (from shared Vault secret)
          - name: BOT_JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: jira-email
          # Bot config
          - name: BOT_BOARD_NAME
            value: ${BOT_BOARD_NAME}
          - name: BOT_SPRINT_PREFIX
            value: ${BOT_SPRINT_PREFIX}
          - name: BOT_INCLUDE_BACKLOG
            value: ${BOT_INCLUDE_BACKLOG}
          - name: BOT_INSTANCE_ID
            value: ${BOT_INSTANCE_ID}
          - name: BOT_CONFIG_REPO
            value: ${BOT_CONFIG_REPO}
          - name: BOT_CONFIG_PATH
            value: ${BOT_CONFIG_PATH}
          - name: CYCLE_RUNS_API_URL
            value: http://devbot-memory-server:8080/api/cycle-runs
          - name: BOT_EXECUTION_ENGINE
            value: ${BOT_EXECUTION_ENGINE}
          - name: REHOR_OPENCODE_DEPLOYMENT_CONFIG
            value: ${REHOR_OPENCODE_DEPLOYMENT_CONFIG}
          - name: REHOR_OPENCODE_MAX_TOOL_CALLS
            value: ${REHOR_OPENCODE_MAX_TOOL_CALLS}
          - name: REHOR_WORKSPACE_OWNER_UID
            value: ${REHOR_WORKSPACE_OWNER_UID}
          - name: REHOR_MODEL_PROXY_URL
            value: ${REHOR_MODEL_PROXY_URL}
          # Non-secret client placeholder; proxy injects the upstream API key.
          - name: REHOR_MODEL_PROXY_TOKEN
            value: ${REHOR_MODEL_PROXY_TOKEN}
          - name: BOT_DASHBOARD_URL
            value: http://devbot-memory-server:8080/api/bot-status
          - name: COSTS_API_URL
            value: http://devbot-memory-server:8080/api/costs
          # Redis sidecar — RBAC defaults (localhost:6379, no password) match automatically
          - name: REDIS_HOST
            value: localhost
          - name: REDIS_PORT
            value: "6379"
          # PostgreSQL sidecar — env vars match RBAC docker-compose and .env.example defaults
          # tox setenv picks these up via {env:DATABASE_NAME:postgres} fallback pattern
          - name: DATABASE_SERVICE_NAME
            value: POSTGRES_SQL
          - name: DATABASE_ENGINE
            value: postgresql
          - name: DATABASE_NAME
            value: postgres
          - name: DATABASE_USER
            value: postgres
          - name: DATABASE_PASSWORD
            value: postgres
          - name: DATABASE_HOST
            value: localhost
          - name: DATABASE_PORT
            value: "15432"
          - name: POSTGRES_SQL_SERVICE_HOST
            value: localhost
          - name: POSTGRES_SQL_SERVICE_PORT
            value: "15432"
          # Slack notifications
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: ai-dev-bot-config
                key: slack-webhook-url
                optional: true
          # Proxy — shared pod deployed by platform-frontend-ai-dev
          - name: PROXY_HOST
            value: devbot-proxy
          - name: HTTP_PROXY
            value: http://devbot-proxy:3128
          - name: HTTPS_PROXY
            value: http://devbot-proxy:3128
          - name: http_proxy
            value: http://devbot-proxy:3128
          - name: https_proxy
            value: http://devbot-proxy:3128
          - name: NO_PROXY
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: no_proxy
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          # Jira — proxied through proxy container (mcp-atlassian on port 8444)
          - name: JIRA_MCP_URL
            value: http://devbot-proxy:8444/mcp
          # GH release upload — proxied through proxy container (port 8446)
          - name: GH_RELEASE_UPLOAD_URL
            value: http://devbot-proxy:8446/upload
          # Secrets that stay in bot container (SSO for E2E)
          - name: SSO_USERNAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: e2e-username
          - name: SSO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: e2e-password
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 8Gi

        # PostgreSQL sidecar — shares pod network so bot reaches it at localhost:15432.
        # Uses the same image as insights-rbac Tekton CI (OpenShift-compatible arbitrary UID).
        # Data is ephemeral (EmptyDir): starts clean on every pod restart, no PVC needed.
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          # postgres/postgres matches RBAC docker-compose defaults and .env.example
          # so make run-migrations works after copying .env.example → .env
          - name: POSTGRESQL_DATABASE
            value: postgres
          - name: POSTGRESQL_USER
            value: postgres
          - name: POSTGRESQL_PASSWORD
            value: postgres
          # Tell postgres process itself to listen on 15432 to match RBAC Makefile (15432:5432 mapping)
          - name: PGPORT
            value: "15432"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rbac", "-d", "rbac"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
          - name: pgdata
            mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Redis sidecar — shares pod network so bot reaches it at localhost:6379.
        # No password, no persistence needed (Celery broker + Django cache for testing).
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        volumes:
        - name: pgdata
          emptyDir: {}

# --- KEDA ScaledObject: Mon-Fri EU + US working hours ---
- apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: ${BOT_NAME}-cron
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: ${BOT_NAME}
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
    - type: cron
      metadata:
        timezone: ${KEDA_CRON_EU_TZ}
        start: ${KEDA_CRON_EU_START}
        end: ${KEDA_CRON_EU_END}
        desiredReplicas: "1"
    - type: cron
      metadata:
        timezone: ${KEDA_CRON_US_TZ}
        start: ${KEDA_CRON_US_START}
        end: ${KEDA_CRON_US_END}
        desiredReplicas: "1"

# --- NetworkPolicy: Bot can only reach proxy + memory-server + DNS ---
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: ${BOT_NAME}-egress
    labels:
      app.kubernetes.io/part-of: devbot
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    policyTypes:
    - Egress
    egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: devbot-proxy
      ports:
      - port: 3128
        protocol: TCP
      - port: 9090
        protocol: TCP
      - port: 8443
        protocol: TCP
      - port: 8444
        protocol: TCP
      - port: 8446
        protocol: TCP
      - port: 8447
        protocol: TCP
      - port: 8450
        protocol: TCP
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: memory-server
      ports:
      - port: 8080
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
      ports:
      - port: 5353
        protocol: UDP
      - port: 5353
        protocol: TCP
