name: Preflight tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  konflux-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and dev-bot
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dev-bot test dependencies
        working-directory: dev-bot
        run: uv sync --frozen --extra dev

      - name: Run Konflux preflight tests
        working-directory: dev-bot
        run: uv run pytest -q ../instance/rbac-config-konflux/agent/workflows/konflux-pr-squash/preflight/tests

      - name: Lint Konflux preflight
        working-directory: dev-bot
        run: >-
          uv run ruff check
          ../instance/rbac-config-konflux/agent/workflows/konflux-pr-squash/preflight/02-check-bot-prs.py
          ../instance/rbac-config-konflux/agent/workflows/konflux-pr-squash/preflight/tests
